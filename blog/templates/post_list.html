<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .post {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .post h2 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        .post .date {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 10px;
        }
        .post p {
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Список постів</h1>

    {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <div class="date">{{ post.published_date }}</div>
            <p>{{ post.content }}</p>
        </div>
    {% empty %}
        <p>Постів ще немає.</p>
    {% endfor %}

</body>
</html>
